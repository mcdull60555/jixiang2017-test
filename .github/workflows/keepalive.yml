# 防止 Supabase 免費專案因 7 天沒有使用而自動暫停
# 每 2 天自動讀一次資料庫（只讀年級清單，約 1 KB，不改任何資料）
name: Supabase 防休眠

on:
  schedule:
    - cron: "30 0 */2 * *"   # 每 2 天，台灣時間上午 8:30（UTC 00:30）
  workflow_dispatch:          # 也可以在 Actions 頁面手動按 Run

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: 讀一次資料庫（測試專案＋正式專案）
        run: |
          ping() {
            for i in 1 2 3; do
              code=$(curl -s -o body.txt -w "%{http_code}" "$1/rest/v1/grades?select=name&limit=1" -H "apikey: $2" -H "Authorization: Bearer $2")
              echo "$3 第 $i 次：HTTP $code"; cat body.txt; echo
              [ "$code" = "200" ] && return 0
              sleep 20
            done
            echo "$3 連不到資料庫，專案可能已經暫停，請到 Supabase 後台按 Restore"; return 1
          }
          ok=0
          # 公開金鑰（publishable），網頁裡本來就有，不是密碼
          ping https://jflnvliefjfxhfwjzqdi.supabase.co sb_publishable_ZVT08ujYz6NmsowKmqBNng_JxBJaVmb 測試專案 || ok=1
          ping https://trmrikaqzwpkwpuzfvuv.supabase.co sb_publishable_HA2cw2Div9TIYjywngPtow_G2XXEjBn 正式專案 || ok=1
          exit $ok

      # GitHub 會停用 60 天沒有任何提交的公開專案排程，這一步每約 45 天自動留一筆紀錄，讓排程不會被停用
      - uses: actions/checkout@v4
      - name: 必要時留一筆紀錄
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive-last.txt
            git config user.name "keepalive-bot"
            git config user.email "keepalive-bot@users.noreply.github.com"
            git add .github/keepalive-last.txt
            git commit -m "防休眠：保持排程啟用"
            git push
          else
            echo "最近有提交，不需要留紀錄"
          fi
